<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Integer</title>
</head>
<body>
    <h2>Reverse Integer</h2>
    <label for="numberinput">Enter an Integer:</label>
    <input type="number" id="numberInput">
    <button onclick="reverseNumber()">Reverse</button>
    <p id="result"></p>

    <script>
        function reverseNumber() {
            let num =parseInt(document.getElementById("numberInput").value, 10);
            if (isNaN(num)) {
                document.getElementById("result").innerText ="Please enter a valid number";
                return;
            }

            let reversedNum = ParseInt(Math.abs(num).toString().split('').reverse().join(''), 10); s
            let result = num < 0 ? -reversedNum : reversedNum;

            document.getElementById("result").innerText ="Reversed: " + result;
        }
    </script>
</body>
</html>
